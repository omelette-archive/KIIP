name: Operational data pipeline

# #70: 실데이터 수집(①)부터 대시보드 게시(⑦)까지 재현하는 운영 실행기.
# 자체 호스트 러너(고정 IP·영구 디스크)에서만 동작한다 — GitHub 호스티드 러너는
# 매 실행 워크스페이스를 비워 KIPRIS 검색 체크포인트·등록원부 캐시·일별 예산 상태를
# 이어갈 수 없다. 러너에는 `self-hosted` + `kiip-operational` 라벨을 붙이고,
# 영구 디스크 경로를 KIIP_OPERATIONAL_ROOT 환경변수로 지정한다(러너 환경 설정).
#
# 2026-09-21: 예약(cron) 트리거를 제거했다. 2026-09-09에 매일 02:00 KST로 걸어뒀지만
# 전용 러너(`kiip-local-runner`)가 계속 offline 상태라 10일 넘게 매일 queued로
# 쌓였다가 ~24시간 뒤 cancelled로 끝났다(GitHub Actions는 cancelled를 failure()로
# 안 쳐서 실패 알림도 안 남— 완전히 조용한 실패였다). 이 기간의 실제 파이프라인 실행은
# 전부 사용자 세션이 데스크탑에서 수동으로 돌린 것이었다. 사용자가 그 전에 이미
# Windows 예약 작업 자동화(별도 경로)를 두고 "자동화 강제 기동 없이 내가 말할 때만
# 진행"을 명시적으로 결정한 바 있어, 이 워크플로도 그 결정과 맞춘다. 러너를
# 다시 온라인으로 만들어 예약을 살리는 대신 workflow_dispatch(수동 실행)만 남긴다.
# 자동 예약이 다시 필요해지면 러너를 먼저 온라인으로 만들고 나서 cron을 되살릴 것.

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "③ 검색 요청 상한"
        required: false
        default: "400"
      applicant_limit:
        description: "③b 출원인 주소 보강 신규 호출 상한"
        required: false
        # 2026-09-08: 5,000 → 12,000. KIPRIS Plus 실제 하루 한도는 아직 정확히 모른다
        # (자주 SERVICE_ACCESS_DENIED — 회로차단으로 안전하게 스킵됨).
        default: "12000"
      ip_registry_daily_budget:
        description: "③c 등록원부 하루 누적 호출 상한"
        required: false
        # 2026-09-09: 100 → 50000. data.go.kr 등록원부 실제 하루 한도를 처음
        # 확인(~10,000건, daily rate limit). 100은 그 1%만 쓰던 셈이라 매일 실제
        # 한도까지 밀어붙이도록 여유 있게 올린다 — 진짜 한도에서 클라이언트가
        # 안전하게 회로차단한다(scripts에 이미 구현됨).
        default: "50000"
      ip_registry_limit:
        description: "③c 등록원부 이번 실행 신규 호출 상한"
        required: false
        default: "20000"

# 전역 잠금: 같은 시점에 두 번 실행되지 않는다. 진행 중 실행을 취소하지 않는다
# (외부 API 호출·체크포인트 정합성 보호).
concurrency:
  group: operational-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: [self-hosted, kiip-operational]
    timeout-minutes: 720

    env:
      # runner 컨텍스트는 job-level env에서 못 쓴다 — 기본값은 아래 스텝에서 셸로 채운다.
      KIIP_OPERATIONAL_ROOT: ${{ vars.KIIP_OPERATIONAL_ROOT }}
      GI_API_KEY: ${{ secrets.GI_API_KEY }}
      NONGSARO_API_KEY: ${{ secrets.NONGSARO_API_KEY }}
      NONGSARO_LOCAL_BRAND_API_KEY: ${{ secrets.NONGSARO_LOCAL_BRAND_API_KEY }}
      KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}
      IP_REGISTRY_API_KEY: ${{ secrets.IP_REGISTRY_API_KEY }}
      NFQS_QUALITY_API_KEY: ${{ secrets.NFQS_QUALITY_API_KEY }}
      NFQS_GEO_API_KEY: ${{ secrets.NFQS_GEO_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Resolve run id and operational root
        id: runid
        shell: bash
        run: |
          echo "value=$(date -u +%Y%m%d)-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "KIIP_OPERATIONAL_ROOT=${KIIP_OPERATIONAL_ROOT:-$HOME/kiip-operational}" >> "$GITHUB_ENV"

      - name: Preflight - required secrets, persistent state dir, node version
        shell: bash
        run: node scripts/checkOperationalEnv.js --state-dir "${KIIP_OPERATIONAL_ROOT}/state"

      - name: Run operational pipeline and promote on validation pass
        id: pipeline
        shell: bash
        run: |
          node scripts/runOperationalPipeline.js \
            --promote \
            --include-review-required \
            --run-id "${{ steps.runid.outputs.value }}" \
            --runs-dir "${KIIP_OPERATIONAL_ROOT}/runs" \
            --state-dir "${KIIP_OPERATIONAL_ROOT}/state" \
            --max-requests "${{ github.event.inputs.max_requests || '400' }}" \
            --applicant-limit "${{ github.event.inputs.applicant_limit || '12000' }}" \
            --ip-registry-daily-budget "${{ github.event.inputs.ip_registry_daily_budget || '50000' }}" \
            --ip-registry-limit "${{ github.event.inputs.ip_registry_limit || '20000' }}"

      # 2026-09-09: 매일 무인 실행이라 npm test 없이 바로 커밋하면 데이터 지문 회귀를
      # main에 그대로 밀어넣고서야 알아챈다(오늘 두 번 겪음). 게시 전에 여기서 걸러
      # 실패하면 커밋하지 않고 실패 이슈로 안내한다 — 다음 실행이 이어서 시도한다.
      - name: Validate dashboard-web contract before publishing
        id: dashboardtest
        if: success()
        shell: bash
        run: |
          cd 07-dashboard/web
          npm install --no-audit --no-fund
          npm test

      - name: Commit and push promoted dashboard
        id: commit
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- 07-dashboard/dashboard.html 07-dashboard/web/public/data/dashboard-snapshot.json; then
            echo "게시할 변경 없음(스냅샷 동일)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 07-dashboard/dashboard.html 07-dashboard/web/public/data/dashboard-snapshot.json
          git commit -m "chore(pipeline): 운영 실행 ${{ steps.runid.outputs.value }} 스냅샷 게시"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # #137 "배포 전 키 diff 보고": 07d_reconcile이 매 실행 남기는
      # public-snapshot-reconcile-report.json(added/retained/revived/tombstoned)을
      # 사람이 매번 러너 디스크를 열어보지 않아도 되도록 커밋 코멘트로 남긴다.
      - name: Post reconcile report as commit comment
        if: success() && steps.commit.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const reportPath = path.join(
              process.env.KIIP_OPERATIONAL_ROOT,
              "runs",
              "${{ steps.runid.outputs.value }}",
              "public-snapshot-reconcile-report.json"
            );
            if (!fs.existsSync(reportPath)) {
              console.log(`reconcile report 없음(첫 배포이거나 07d 미실행): ${reportPath}`);
              return;
            }
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const c = report.counts || {};
            const body = [
              `## 07d_reconcile 배포 전 키 diff 요약 (run ${{ steps.runid.outputs.value }})`,
              ``,
              `이전 스냅샷 \`${report.previousSnapshotId || "(없음)"}\` → 이번 \`${report.nextSnapshotId || "(없음)"}\``,
              ``,
              `| 구분 | 건수 |`,
              `|---|---|`,
              `| 유지(retained) | ${c.retained ?? "—"} |`,
              `| 신규(added) | ${c.added ?? "—"} |`,
              `| 지표 floor 유지(metricFloorRetained) | ${c.metricFloorRetained ?? "—"} |`,
              `| last-known-good 복원(revivedLastKnownGood) | ${c.revivedLastKnownGood ?? "—"} |`,
              `| 전국→지역 이동(relocatedNationwideToRegional) | ${c.relocatedNationwideToRegional ?? "—"} |`,
              `| 같은 고시명칭 원물명 변경(relocatedSpecialtyRename) | ${c.relocatedSpecialtyRename ?? "—"} |`,
              `| tombstone으로 제거(removedWithTombstone) | ${c.removedWithTombstone ?? "—"} |`,
              ``,
              report.blocked ? `⚠️ ${report.blockReason}` : "대량 실종 없음 — 정상 배포.",
            ].join("\n");
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: "${{ steps.commit.outputs.sha }}",
              body,
            });

      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runId = "${{ steps.runid.outputs.value }}";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `운영 파이프라인 실패: ${runId}`;
            const body = [
              `주간 운영 파이프라인 실행이 실패했습니다.`,
              ``,
              `- run-id: \`${runId}\``,
              `- Actions 로그: ${url}`,
              `- 트리거: ${context.eventName}`,
              ``,
              `체크포인트·보강 캐시는 러너의 영구 디스크(\`KIIP_OPERATIONAL_ROOT\`)에 보존됩니다. 원인을 확인한 뒤 같은 워크플로를 재실행하면 미완료 지점부터 이어집니다.`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "operational-pipeline-failure",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["operational-pipeline-failure"],
              });
            }
