name: Pipeline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate pipeline
        run: node scripts/validatePipeline.js

  dashboard-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: 07-dashboard/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 07-dashboard/web/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate dashboard build and snapshot contract
        run: npm test

      - name: Verify committed standalone HTML matches dashboard sources
        run: git diff --exit-code -- ../dashboard.html
