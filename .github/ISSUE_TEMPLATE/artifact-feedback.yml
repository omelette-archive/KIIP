name: 산출물 피드백
description: 알파 대시보드의 화면, 수치, 문구, 사용 흐름에 대한 의견을 남깁니다.
title: "[산출물 피드백] "
body:
  - type: markdown
    attributes:
      value: |
        검토한 페이지 주소와 버전을 함께 남기면 변경 전후를 정확히 재현할 수 있습니다.
        버전은 산출물 허브 또는 버전 내역에서 확인할 수 있습니다.
  - type: input
    id: page_url
    attributes:
      label: 검토한 페이지
      description: 최신본 또는 과거 버전의 전체 URL을 붙여 주세요.
      placeholder: https://omelette-archive.github.io/KIIP-artifacts/latest/
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전 ID
      description: 알고 있다면 커밋 앞 12자리를 적어 주세요.
      placeholder: 7182c518e018
  - type: dropdown
    id: feedback_type
    attributes:
      label: 피드백 유형
      options:
        - 데이터·수치
        - 화면·사용성
        - 문구·설명
        - 오류·동작 문제
        - 기능 제안
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 내용
      description: 확인한 상황, 기대한 결과, 제안 내용을 구체적으로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 참고 자료
      description: 스크린샷, 관련 이슈, 근거 링크가 있다면 추가해 주세요.
